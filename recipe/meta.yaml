{% set name = "dggrid" %}
{% set version = "9.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/sahrk/DGGRID/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 04bb3384beee15deaf3de0050f110d86ad34a9e47dd10712f73f7a3ea5982a4b

build:
  number: 0

requirements:
  build:
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - cmake >=3.19,<4
    - make  # [not win]
    - ninja  # [win]
  host:
    - libgdal
    - shapelib
  run:
    - libgdal
    - shapelib

test:
  commands:
    - dggrid -v
    - dggrid.exe -v  # [win]

about:
  home: https://github.com/sahrk/DGGRID
  license: AGPL-3.0-or-later
  license_file: LICENSE
  summary: A command-line application that generates and manipulates icosahedral discrete global grids.

  dev_url: https://github.com/sahrk/DGGRID

extra:
  recipe-maintainers:
    - allixender
