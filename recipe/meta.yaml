{% set name = "dggrid" %}
{% set version = "9.15" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://github.com/sahrk/DGGRID/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 4133ae364eb427547e0308a8852ef7375decee627cb18c02b3ab023a3778064e

build:
  number: 0

requirements:
  build:
    - {{ compiler("cxx") }}
    - {{ stdlib("c") }}
    - cmake >=3.20
    - make  # [not win]
    - ninja  # [win]
  host:
    - libgdal
    - shapelib
  run:
    - libgdal
    - shapelib

test:
  commands:
    - dggrid -v
    - dggrid.exe -v  # [win]

about:
  home: https://github.com/sahrk/DGGRID
  license: AGPL-3.0-or-later
  license_file:
    - LICENSE
    - LICENSE.H3
    - src/lib/proj4lib/LICENSE
  summary: A command-line application that generates and manipulates icosahedral discrete global grids.

  dev_url: https://github.com/sahrk/DGGRID

extra:
  recipe-maintainers:
    - allixender
